name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          # Configure the secret allowlist in .upptimerc.yml; do not edit this workflow directly.
          SECRETS_CONTEXT: '{"CORE_API_PATH":${{ toJson(secrets.CORE_API_PATH) }},"GRAPH_API_PATH":${{ toJson(secrets.GRAPH_API_PATH) }},"ACTION_ITEMS_API_PATH":${{ toJson(secrets.ACTION_ITEMS_API_PATH) }},"ATS_API_PATH":${{ toJson(secrets.ATS_API_PATH) }},"AUDIT_TRAIL_API_PATH":${{ toJson(secrets.AUDIT_TRAIL_API_PATH) }},"DISCUSSIONS_API_PATH":${{ toJson(secrets.DISCUSSIONS_API_PATH) }},"IDENTITY_OS_API_PATH":${{ toJson(secrets.IDENTITY_OS_API_PATH) }},"ONE_ON_ONES_API_PATH":${{ toJson(secrets.ONE_ON_ONES_API_PATH) }},"SETTINGS_API_PATH":${{ toJson(secrets.SETTINGS_API_PATH) }},"TALENT_MATCHING_API_PATH":${{ toJson(secrets.TALENT_MATCHING_API_PATH) }},"WORKFLOWS_OS_API_PATH":${{ toJson(secrets.WORKFLOWS_OS_API_PATH) }},"REPORTS_API_PATH":${{ toJson(secrets.REPORTS_API_PATH) }},"BILLING_API_PATH":${{ toJson(secrets.BILLING_API_PATH) }},"CLIENT_API_PATH":${{ toJson(secrets.CLIENT_API_PATH) }},"RDLC_API_PATH":${{ toJson(secrets.RDLC_API_PATH) }},"FUNCTION_CORE_API_PATH":${{ toJson(secrets.FUNCTION_CORE_API_PATH) }},"WORKFLOW_FUNCTIONS_API_PATH":${{ toJson(secrets.WORKFLOW_FUNCTIONS_API_PATH) }},"NOTIFICATIONS_FN_API_PATH":${{ toJson(secrets.NOTIFICATIONS_FN_API_PATH) }},"TME_FN_API_PATH":${{ toJson(secrets.TME_FN_API_PATH) }},"WORKFLOWS_STUDIO_PATH":${{ toJson(secrets.WORKFLOWS_STUDIO_PATH) }},"NOTIFICATION_TEAMS":${{ toJson(secrets.NOTIFICATION_TEAMS) }},"NOTIFICATION_TEAMS_WEBHOOK_URL":${{ toJson(secrets.NOTIFICATION_TEAMS_WEBHOOK_URL) }}}'
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Generate graphs
        id: dispatch_graphs
        uses: benc-uk/workflow-dispatch@v1
        continue-on-error: true
        with:
          workflow: Graphs CI
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Setup Node.js for direct graph generation
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Generate graphs directly if dispatch fails
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.43.15
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - uses: peaceiris/actions-gh-pages@v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
